<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT5 $500</title>
<style>body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui}.wrap{max-width:500px;margin:0 auto;border-left:2px solid #3b82f6;border-right:2px solid #3b82f6;min-height:100vh;padding:10px}.h{text-align:center;font-weight:900;color:#60a5fa;font-size:18px;margin:10px 0}.circle{width:200px;height:200px;border-radius:50%;margin:15px auto;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}.c1{border:6px solid #3b82f6;background:#0e1a2e}.c2{border:6px solid #22c55e;background:#0a1a0a}.c3{border:6px solid #facc15;background:#1a1500}.dot{width:12px;height:12px;border-radius:50%;position:absolute;top:8px;background:#3b82f6}.lab{font-size:11px;opacity:.8;font-weight:900}.val{font-size:28px;font-weight:900;color:#60a5fa}.box{border:1px solid #3b82f6;border-radius:12px;padding:10px;margin:10px 0;background:#0a1220}.box2{border:1px solid #333;border-radius:12px;padding:10px;margin:10px 0;background:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.coin{background:#111e33;border-radius:12px;padding:10px;border:1px solid #222}.btn{width:100%;padding:8px;border-radius:8px;border:0;font-weight:900}.bl{background:#3b82f6;color:#fff}.y{background:#facc15;color:#000}.g{background:#22c55e;color:#000}.d{background:#222;color:#fff} select,input{width:100%;padding:8px;background:#111;border:1px solid #333;color:#fff;border-radius:8px;font-size:12px} table{width:100%;font-size:10px;border-collapse:collapse} th{opacity:.5;text-align:left;padding:4px} td{padding:6px;border-top:1px solid #222}.vender{background:#ef4444;color:#fff;border:0;border-radius:6px;padding:4px 10px}</style></head><body>
<div class="wrap">
<div class="h">📊 MÁQUINA MT5 - $500 BASE</div>
<div class="circle c1"><div class="dot"></div><div class="lab">DISPONIBLE<br>Arriba Chico</div><div class="val" id="disp">$500</div><div style="font-size:11px;opacity:.6" id="bloq">Bloq: $0 en 0</div></div>
<div class="circle c2"><div class="dot" style="background:#22c55e"></div><div class="lab">GANANCIA<br>Medio</div><div class="val" style="color:#22c55e" id="gan">$0</div></div>
<div class="circle c3"><div class="dot" style="background:#facc15"></div><div class="lab">TOTAL REAL<br>Abajo Grande</div><div class="val" style="color:#facc15" id="total">$500</div><div style="font-size:11px" id="bola_info">bola $62.5</div></div>
<div class="box"><div>🎯 BOLA MT5:</div><b id="bola">$62.50 USD (8 bolas) = $500 / 8 (4 LONG + 4 SHORT)</b></div>
<div id="coins" class="grid"></div>
<div class="box2"><table id="pos"><tr><th>Activo</th><th>Tipo</th><th>Entry</th><th>Ahora</th><th>Neta</th><th>Acción</th></tr></table></div>
<div class="box2"><div style="color:#22c55e;font-weight:900">📋 REGISTRO MT5</div><table id="hist"></table></div>
<div style="border:2px dashed #3b82f6;border-radius:12px;padding:12px;text-align:center"><button class="bl" style="padding:12px;width:100%;border-radius:10px;border:0;font-weight:900" onclick="backup()">💾 DESCARGAR RESPALDO MT5</button></div>
</div>
<script>
async function load(){let S=await fetch('/api/state').then(r=>r.json());let total=(S.disponible_m||500)+(S.bloqueado_m||0)+(S.gan_mt5||0);
document.getElementById('disp').innerText='$'+(S.disponible_m||0).toFixed(2);document.getElementById('gan').innerText='$'+(S.gan_mt5||0).toFixed(2);document.getElementById('total').innerText='$'+total.toFixed(2);document.getElementById('bola').innerText='$'+(total/8).toFixed(2)+' USD (8 bolas) = $'+total.toFixed(2)+' / 8';document.getElementById('bola_info').innerText='bola $'+(total/8).toFixed(2);document.getElementById('bloq').innerText='Bloq: $'+(S.bloqueado_m||0).toFixed(2)+' en '+((S.pos_m||[]).length+(S.pos_m_short||[]).length);
document.getElementById('coins').innerHTML=Object.entries(S.coins_mt5_activas||{"XAUUSD":true,"XAGUSD":true,"USOIL":true,"SPX500":true}).map(([k,v])=>`<div class="coin"><div style="display:flex;justify-content:space-between"><b>${k}</b><button class="g" style="border-radius:20px;padding:4px 12px" onclick="toggleC('${k}')">${v?'ON':''}</button></div><div style="font-size:18px;font-weight:900">$${(2000+Math.random()*100).toFixed(2)}</div><div style="font-size:11px">Espera RSI<br>RSI ${(40+Math.random()*10).toFixed(1)}</div><button class="d" style="width:100%;margin-top:6px;padding:8px;border-radius:8px;border:0">GRÁFICA</button></div>`).join('');
document.getElementById('pos').innerHTML='<tr><th>Activo</th><th>Tipo</th><th>Entry</th><th>Ahora</th><th>Neta</th><th>Acción</th></tr>'+[...(S.pos_m||[]),...(S.pos_m_short||[])].map(p=>`<tr><td>${p.sym}</td><td>LONG</td><td>${p.entry||0}</td><td>${p.now||0}</td><td>-0.2%</td><td><button class="vender" onclick="sell('${p.sym}')">Vender</button></td></tr>`).join('')||'<tr><td colspan=6 style="text-align:center">Sin posiciones MT5</td></tr>';
document.getElementById('hist').innerHTML='<tr><th>Fecha</th><th>Activo</th><th>Monto</th><th>Gan</th></tr>'+(S.historial_m||[]).slice(-10).reverse().map(h=>`<tr><td>${(h.fecha||'').slice(0,10)}</td><td>${h.moneda||''}</td><td>$62.50</td><td>$${h.gan||0}</td></tr>`).join('');
}
function toggleC(k){fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({toggle_coin_mt5:k})}).then(load)}
function sell(s){fetch('/api/sell_mt5/'+s,{method:'POST'}).then(load)}
function backup(){fetch('/api/backup').then(r=>r.blob()).then(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo_mt5.json';a.click()})}
setInterval(load,3000);load();
</script></body></html>
