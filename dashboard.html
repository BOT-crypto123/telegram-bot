<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V7 DOBLE CEREBRO 500+500</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
.card{border:2px solid gold;border-radius:20px;padding:15px;margin:10px 0;background:#111}
.circle{width:250px;height:250px;border-radius:50%;border:8px solid;margin:15px auto;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.yellow{border-color:#facc15}.green{border-color:#22c55e}.blue{border-color:#38bdf8}
.btn{background:#facc15;color:#000;padding:10px 20px;border-radius:20px;font-weight:bold;border:none;margin:5px;cursor:pointer}
.btn-blue{background:#38bdf8}
.small{font-size:11px;color:#aaa}.big{font-size:34px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{border:1px solid #333;padding:8px;border-radius:10px;background:#0a0a0a;font-size:12px}
.badge{padding:2px 6px;border-radius:6px;font-size:9px}
.crypto{background:#facc15;color:#000}.oro{background:#ffd700;color:#000}.indice{background:#38bdf8;color:#000}.petro{background:#000;color:#0f0;border:1px solid #0f0}
</style></head><body>
<h2 style="color:gold;text-align:center">💰 V7 DOBLE CEREBRO - $500 + $500</h2>
<div id="portada"></div>
<div id="manual" style="display:none"></div>
<script>
let S=null; let modo='BINANCE'; let pricesB=null; let pricesM=null;
async function load(){ let r=await fetch('/api/state'); S=await r.json(); if(document.getElementById('manual').style.display==='none') renderPortada(); }
function renderPortada(){
 let cb=S.capital_binance||500; let cm=S.capital_mt5||500; let total=cb+cm;
 let bola_b=cb/(S.max_entradas||8); let bola_m=cm/(S.max_entradas||8);
 document.getElementById('portada').innerHTML=`
 <div class="card" onclick="openBot('BINANCE')" style="cursor:pointer;border-color:#facc15">
  <h3>🟡 BINANCE CRYPTO - $${cb.toFixed(2)} - BOLA $${bola_b.toFixed(2)}</h3>
  <div class="small">Disp $${(S.disponible_binance||cb).toFixed(2)} | Bloq $${(S.bloqueado_binance||0).toFixed(2)} | Auto ${S.auto_binance?'ON':'OFF'}</div>
  <div class="small">RSI ${S.rsi_binance_compra||35} | EMA OFF | TP 0.3% | Solo cripto</div>
  <button class="btn">ENTRAR BINANCE - $500</button>
 </div>
 <div class="card" onclick="openBot('MT5')" style="cursor:pointer;border-color:#38bdf8">
  <h3>🔵 MT5 ORO/PETROLEO/INDICES - $${cm.toFixed(2)} - BOLA $${bola_m.toFixed(2)}</h3>
  <div class="small">Disp $${(S.disponible_mt5||cm).toFixed(2)} | Bloq $${(S.bloqueado_mt5||0).toFixed(2)} | Auto ${S.auto_mt5?'ON':'OFF'}</div>
  <div class="small">RSI 55 + EMA ON + Horario USA | Solo XAU XAG USOIL SPX NAS</div>
  <button class="btn btn-blue">ENTRAR MT5 - $500</button>
 </div>
 <div class="card" style="text-align:center;border-color:#555">
  <div class="small">TOTAL</div>
  <div class="big" style="color:#38bdf8">$${total.toFixed(2)}</div>
  <div class="small">BIN $${cb.toFixed(2)} + MT5 $${cm.toFixed(2)} = $${total.toFixed(2)}</div>
  <div class="small" style="color:#22c55e">V7: BINANCE RSI 35 | MT5 RSI 55+EMA ON</div>
 </div>`;
 document.getElementById('manual').style.display='none'; document.getElementById('portada').style.display='block';
}
async function openBot(m){
 modo=m;
 let cap = m==='BINANCE'? S.capital_binance : S.capital_mt5;
 let bola = cap / (S.max_entradas||8);
 let disp = m==='BINANCE'? S.disponible_binance : S.disponible_mt5;
 let bloq = m==='BINANCE'? S.bloqueado_binance : S.bloqueado_mt5;
 let posCount = m==='BINANCE'? (S.pos?S.pos.length:0) : (S.pos_mt5?S.pos_mt5.length:0);
 let usd=S.usd_mxn||18.5;
 let autoOn = m==='BINANCE'? S.auto_binance : S.auto_mt5;
 document.getElementById('portada').style.display='none';
 document.getElementById('manual').style.display='block';
 document.getElementById('manual').innerHTML=`
 <button class="btn" onclick="renderPortada()">← VOLVER</button>
 <button class="btn ${autoOn?'':'btn-blue'}" onclick="toggleAuto('${m}')">${m} AUTO ${autoOn?'ON':'OFF'}</button>
 <h3 style="color:${m==='BINANCE'?'gold':'#38bdf8'}">${m} MANUAL - $${cap.toFixed(2)} FIJO - NO $1000</h3>
 <div class="card">
  <div class="circle yellow"><div class="small">DISPONIBLE</div><div class="big" style="color:#facc15">$${(disp||cap).toFixed(2)}</div><div class="small">$${((disp||cap)*usd).toFixed(0)} MXN<br>Bloq: $${(bloq||0).toFixed(2)} en ${posCount}<br><b>${m} $${cap.toFixed(2)}</b><br>BOLA $${bola.toFixed(2)} x ${S.max_entradas}</div></div>
  <div class="circle green"><div class="small">GANANCIA</div><div class="big" style="color:#38bdf8">$${(S.gan_acum||0).toFixed(2)}</div><div class="small">$${((S.gan_acum||0)*usd).toFixed(0)} MXN</div></div>
  <div class="circle blue"><div class="small">TOTAL REAL ${m}</div><div class="big" style="color:#38bdf8">$${cap.toFixed(2)}</div><div class="small">$${(cap*usd).toFixed(0)} MXN<br>BOLA $${bola.toFixed(2)} x ${S.max_entradas} = $${cap.toFixed(2)}<br><b style="color:gold">FIJO $500 - NO SUMADO</b></div></div>
  <div style="margin-top:15px"><h4>${m} MERCADO - ${m==='BINANCE'?'CRYPTO SOLO':'ORO/PETROLEO/INDICES - SIN BTC'}</h4><div id="market">Cargando...</div></div>
  <div style="margin-top:15px"><h4>Posiciones ${m} (${posCount})</h4><div id="posList"></div></div>
 </div>`;
 if(m==='BINANCE'){ let rp=await fetch('/api/prices'); pricesB=await rp.json(); renderMarketB(); renderPosB(); }
 else { let rp=await fetch('/api/prices_mt5'); pricesM=await rp.json(); renderMarketM(); renderPosM(); }
}
function renderMarketB(){
 let html='<div class="grid">';
 for(let k in pricesB){
  let v=pricesB[k];
  if(S.coins_activas &&!S.coins_activas[k]) continue;
  let color=v.ok?'#22c55e':'#333';
  html+=`<div class="item" style="border-color:${color}"><div><b>${k}</b> <span class="badge crypto">CRYPTO</span></div><div>$${v.price.toFixed(2)}</div><div class="small">RSI ${v.rsi} | ${v.sug}</div></div>`;
 }
 html+='</div>';
 document.getElementById('market').innerHTML=html;
}
function renderMarketM(){
 let html='<div class="grid">';
 for(let k in pricesM){
  let v=pricesM[k];
  if(k.includes('BTC')||k.includes('ETH')||k.includes('SOL')||k.includes('BNB')) continue;
  if(S.coins_mt5_activas &&!S.coins_mt5_activas[k]) continue;
  let badge='oro'; let nombre=k;
  if(k==='XAUUSD') {badge='oro'; nombre='ORO';}
  if(k==='XAGUSD') {badge='oro'; nombre='PLATA';}
