<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5 DUAL $500+$500</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:10px} .card{border:2px solid gold;border-radius:20px;padding:15px;margin:10px 0;background:#111} .circle{width:220px;height:220px;border-radius:50%;border:8px solid gold;margin:10px auto;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center} .btn{background:gold;color:#000;padding:10px 20px;border-radius:20px;font-weight:bold;border:none;margin:5px;cursor:pointer} .btn-blue{background:#38bdf8} .small{font-size:11px;color:#aaa} .big{font-size:32px;font-weight:bold} .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px} .item{border:1px solid #333;padding:8px;border-radius:10px;background:#0a0a0a;font-size:12px}</style>
</head><body>
<h2 style="color:gold;text-align:center">💰 V5 DUAL SEPARADO - $500 + $500</h2>
<div id="app">Cargando V5...</div>
<script>
let S=null;
async function load(){
 let r=await fetch('/api/state'); S=await r.json();
 let cb=S.capital_binance||500; let cm=S.capital_mt5||500;
 let bola_b=(cb/(S.max_entradas||8)).toFixed(2); let bola_m=(cm/(S.max_entradas||8)).toFixed(2);
 document.getElementById('app').innerHTML=`
 <div class="card" style="border-color:gold">
  <h3>🟡 BINANCE $${cb.toFixed(2)} - BOLA $${bola_b}</h3>
  <div class="small">Disp $${(S.disponible_usd||cb).toFixed(2)} | Auto ${S.auto?'ON':'OFF'}</div>
  <div class="small">RSI ${S.rsi_compra} | TP ${S.tp}% | Solo cripto</div>
  <button class="btn" onclick="ver('BINANCE')">ENTRAR BINANCE</button>
  <button class="btn" onclick="backup('binance')">BACKUP BIN</button>
 </div>
 <div class="card" style="border-color:#38bdf8">
  <h3>🔵 MT5 $${cm.toFixed(2)} - BOLA $${bola_m}</h3>
  <div class="small">ORO, PLATA, PETROLEO, SP500 - SIN BTC/ETH</div>
  <button class="btn" style="background:#38bdf8" onclick="ver('MT5')">ENTRAR MT5</button>
  <button class="btn" style="background:#38bdf8" onclick="backup('mt5')">BACKUP MT5</button>
 </div>
 <div class="card" style="text-align:center"><div class="big" style="color:#38bdf8">$${(cb+cm).toFixed(2)}</div><div class="small">TOTAL BIN $${cb.toFixed(2)} + MT5 $${cm.toFixed(2)} | Cada círculo $500 fijo, NO $1000</div></div>`;
}
async function ver(m){
 let cap=m==='BINANCE'?S.capital_binance:S.capital_mt5; let bola=cap/(S.max_entradas||8); let usd=S.usd_mxn||18.5;
 let pr= m==='BINANCE'? await (await fetch('/api/prices')).json() : await (await fetch('/api/prices_mt5')).json();
 let html='<button class="btn" onclick="load()">← VOLVER</button><h3>'+m+' - $'+cap.toFixed(2)+' FIJO</h3><div class="card"><div class="circle"><div class="small">TOTAL REAL '+m+'</div><div class="big">$'+cap.toFixed(2)+'</div><div class="small">$'+(cap*usd).toFixed(0)+' MXN<br>BOLA $'+bola.toFixed(2)+' x '+S.max_entradas+'<br><b style="color:gold">$500 FIJO</b></div></div></div><div class="grid">';
 for(let k in pr){
  if(m==='MT5' && (k==='BTC'||k==='ETH'||k==='SOL'||k==='BNB'||k==='XRP'||k==='ADA'||k==='AVAX'||k==='DOGE')) continue;
  let v=pr[k]; let nombre=k; if(k==='XAUUSD') nombre='ORO'; if(k==='XAGUSD') nombre='PLATA'; if(k==='USOIL') nombre='PETROLEO';
  html+=`<div class="item"><b>${k}</b> ${nombre} $${v.price.toFixed(2)} RSI ${v.rsi} ${v.sug}</div>`;
 }
 html+='</div>';
 document.getElementById('app').innerHTML=html;
}
function backup(t){ window.open('/api/backup/'+t,'_blank'); }
load();
</script></body></html>
