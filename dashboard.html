<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOT AUTO-TUNE</title>
<style>
body{background:#0f172a;color:#fff;font-family:system-ui;padding:10px;margin:0}
.card{background:#1e293b;padding:12px;border-radius:12px;margin:8px 0;border:1px solid #334155}
button{padding:7px 12px;border-radius:8px;border:0;font-weight:bold;cursor:pointer;margin:2px}
.on{background:#22c55e;color:#000}.off{background:#475569;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.coin{position:relative}.compra{border:2px solid #22c55e;box-shadow:0 0 10px #22c55e55}
.small{font-size:11px;color:#94a3b8}.green{color:#22c55e}.red{color:#ef4444}
input,select{background:#0f172a;color:#fff;border:1px solid #334155;border-radius:6px;padding:4px}
a.chart{color:#38bdf8;text-decoration:none;font-size:12px;border:1px solid #38bdf8;padding:4px 8px;border-radius:6px;display:inline-block;margin-top:4px}
</style></head><body>
<h2 style="margin:5px 0">🤖 BOT <span id="tune_badge"></span></h2>

<div class="card">
<div class="grid">
<div>Capital: $<b id="cap"></b> | Bola: $<span id="bola"></span></div>
<div>Win: <b id="wr"></b>% (<span id="gs"></span>) | Acum: $<b id="acum"></b> MXN</div>
</div>
<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
<button id="btn_tune" onclick="toggleTune()"></button>
<button id="btn_auto" onclick="toggleAuto()"></button>
<label>Bolas: <select id="max" onchange="setMax(this.value)"><option value="3">3</option><option value="5">5</option><option value="8">8</option></select></label>
<span id="tune_info" class="small"></span>
</div>
<div id="manual" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
TP% <input id="tp" type="number" step="0.1" style="width:55px" onchange="setConf('tp',this.value)">
SL% <input id="sl" type="number" step="0.1" style="width:65px" onchange="setConf('sl_pct',this.value)">
RSI C <input id="rsi_c" type="number" style="width:45px" onchange="setConf('rsi_compra',this.value)">
RSI V <input id="rsi_v" type="number" style="width:45px" onchange="setConf('rsi_venta',this.value)">
EMA <select id="ema" onchange="setConf('filtro_ema',this.value)"><option>ON</option><option>OFF</option></select>
</div>
</div>

<div id="coins" class="grid"></div>
<div id="pos"></div>
<div id="hist" class="card"></div>

<script>
async function load(){
 let [st,pr] = await Promise.all([fetch('/api/state').then(r=>r.json()), fetch('/api/prices').then(r=>r.json())]);
 document.getElementById('cap').innerText=st.capital.toFixed(2);
 document.getElementById('bola').innerText=st.bola.toFixed(0)+' ($'+st.bola_mxn.toFixed(0)+' MXN)';
 document.getElementById('wr').innerText=st.winrate.toFixed(0); document.getElementById('gs').innerText=st.ganadas+'/'+st.salidas;
 document.getElementById('acum').innerText=st.gan_acum_mxn.toFixed(0);
 document.getElementById('tp').value=st.tp; document.getElementById('sl').value=st.sl_pct; document.getElementById('rsi_c').value=st.rsi_compra; document.getElementById('rsi_v').value=st.rsi_venta; document.getElementById('ema').value=st.filtro_ema;
 document.getElementById('max').value=st.max_entradas;
 document.getElementById('btn_auto').innerText=st.auto?'AUTO ON':'AUTO OFF'; document.getElementById('btn_auto').className=st.auto?'on':'off';
 document.getElementById('btn_tune').innerText='🧠 AUTO-TUNE '+(st.auto_tune?'ON':'OFF'); document.getElementById('btn_tune').className=st.auto_tune?'on':'off';
 document.getElementById('tune_badge').innerText=st.auto_tune?'[AUTO-TUNE ON]':'[MANUAL]';
 document.getElementById('tune_info').innerText=st.auto_tune?'Él ajusta TP/SL/RSI/EMA solo cada 15m':'Tú controlas manual';
 document.getElementById('manual').style.opacity=st.auto_tune?0.35:1; document.getElementById('manual').style.pointerEvents=st.auto_tune?'none':'auto';

 let h=''; for(let c in pr){ let a=st.coins_activas[c]; let p=pr[c]; let cls=p.sug=='COMPRA'?'card coin compra':'card coin';
 h+=`<div class="${cls}"><b>${c}</b> ${a?'🟢':'🔴'}<br>$${p.price.toFixed(2)} <span class="${p.sug=='COMPRA'?'green':'small'}">${p.sug}</span><br><span class="small">RSI ${p.rsi} | ${p.motivo||''}</span><br>
 <button onclick="buy('${c}')">Comprar</button> <button onclick="toggleCoin('${c}')" class="${a?'on':'off'}">${a?'ON':'OFF'}</button><br>
 <a class="chart" href="/chart/${c}" target="_blank">📈 Grafica tiempo real</a></div>`}
 document.getElementById('coins').innerHTML=h;

 let ph=''; if(st.pos.length==0) ph='Sin posiciones'; else st.pos.forEach(p=>{
 ph+=`<div style="display:flex;justify-content:space-between"><span>${p.sym} ${p.gan_neta_pct>=0?'<span class=green>+': '<span class=red>'}${p.gan_neta_pct.toFixed(2)}%</span> $${p.gan_neta_mxn.toFixed(0)}</span><button onclick="sell('${p.sym}')">Vender</button></div>`});
 document.getElementById('pos').innerHTML='<div class="card"><b>Posiciones abiertas:</b><br>'+ph+'</div>';

 let hh='<b>Historial (solo ganancias avisan en Telegram)</b><br>'; st.historial.slice(-15).reverse().forEach(x=>{
 hh+=`<span class="small">${x.fecha}</span> ${x.sym} <span class="${x.gan_neta_pct>=0?'green':'red'}">${x.gan_neta_pct.toFixed(2)}%</span> $${x.gan_neta_mxn.toFixed(0)}<br>`});
 document.getElementById('hist').innerHTML=hh;
}
function setConf(k,v){fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({[k]:v})}).then(()=>load())}
function setMax(v){fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max:v})}).then(()=>load())}
function toggleCoin(c){fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({toggle_coin:c})}).then(()=>load())}
function toggleAuto(){fetch('/api/toggle',{method:'POST'}).then(()=>load())}
function toggleTune(){let cur=document.getElementById('btn_tune').innerText.includes('ON'); let next=cur?'OFF':'ON'; fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({auto_tune:next})}).then(()=>load())}
function buy(s){fetch('/api/buy/'+s,{method:'POST'}).then(()=>load())}
function sell(s){fetch('/api/sell/'+s,{method:'POST'}).then(()=>load())}
setInterval(load,3000); load();
</script></body></html>
