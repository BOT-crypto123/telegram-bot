<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1">
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:8px}.header{border:2px solid #ffcc00;border-radius:22px;padding:16px;background:#111;text-align:center}.card{background:#151515;border:2px solid #333;border-radius:14px;padding:10px}.card.buy{border-color:#00ff88}.btn{padding:8px;border-radius:8px;border:none;font-weight:bold;margin:2px;font-size:10px}.btn-g{background:#00ff88;color:#000}.btn-r{background:#ff4444;color:#fff}.config{background:#151515;padding:10px;border-radius:12px;margin:10px 0;display:flex;gap:8px;flex-wrap:wrap}.sug{background:#1a1a00;border:2px solid #00ff88;border-radius:12px;padding:10px;margin:10px 0;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body>
<div class=header><b style=color:#ffcc00;font-size:18px>MÁQUINA BOLA DE NIEVE V1002</b><div id=info>...</div></div>
<div class=config>
TP<select id=tp onchange="cfg('tp',this.value)"><option value=0.3>0.1% NETO</option><option value=0.5 selected>0.3% NETO</option><option value=0.7>0.5% NETO</option></select>
SL<select id=sl onchange="cfg('sl_pct',this.value)"><option value=-1>-1%</option><option value=-2 selected>-2%</option><option value=-3>-3%</option></select>
RSI Venta<select id=rsiV onchange="cfg('rsi_venta',this.value)"><option value=70>70</option><option value=72 selected>72</option><option value=75>75</option></select>
P>EMA<select id=ema onchange="cfg('filtro_ema',this.value)"><option value=ON>ON</option><option value=OFF selected>OFF Agresivo - CAIDA</option></select>
Bolas<select id=max onchange="cfg('max',this.value)"><option>3</option><option>5</option><option>8</option><option>10</option></select>
<button class=btn btn-g onclick="toggle()">AUTO ON/OFF</button>
</div>
<div class=sug><b style=color:#00ff88>CEREBRO - CAIDA FUERTE HOY</b><div id=cerebro>Cargando...</div></div>
<div id=grid class=grid></div><div id=pos style=margin-top:10px></div>
<script>
async function load(){
let s=await (await fetch('/api/state')).json();
let p=await (await fetch('/api/prices')).json();
document.getElementById('info').innerHTML='Capital $'+s.capital.toFixed(2)+' | Bola $'+s.bola.toFixed(2)+' | Pos '+s.pos.length+' | Meta $500';
document.getElementById('tp').value=s.tp;document.getElementById('sl').value=s.sl_pct;document.getElementById('rsiV').value=s.rsi_venta;document.getElementById('ema').value=s.filtro_ema;document.getElementById('max').value=s.max_entradas;
let caidas=Object.values(p).filter(x=>!x.p_ema_ok).length;
document.getElementById('cerebro').innerHTML='Caida: '+caidas+'/8 monedas bajo EMA<br>HOY USA: SL -2% | RSI Venta 70 | EMA OFF<br>'+Object.keys(p).map(k=>k+': '+p[k].sug+' RSI '+p[k].rsi).join('<br>');
let h='';for(let k in p){let c=p[k];h+='<div class="card '+(c.ok?'buy':'')+'"><b>'+k+' $'+c.price.toFixed(2)+'</b><br>RSI '+c.rsi+' / '+c.limite+'<br>'+c.motivo+'<br><button class=btn btn-g onclick="buy(\''+k+'\')">COMPRA</button><button class=btn btn-r onclick="sell(\''+k+'\')">VENDE</button></div>'}
document.getElementById('grid').innerHTML=h;
document.getElementById('pos').innerHTML=s.pos.map(x=>'<div style=background:#111;padding:6px;margin:3px;border-radius:6px;border:1px solid #00ff88>'+x.sym+' Entry '+x.entry.toFixed(2)+' Ahora '+x.ahora.toFixed(2)+' '+x.gan_neta_pct.toFixed(2)+'%</div>').join('')||'Sin posiciones';
}
async function cfg(k,v){let b={};b[k]=isNaN(v)?v:parseFloat(v);if(k=='max')b={max:parseInt(v)};await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});load()}
async function buy(s){await fetch('/api/buy/'+s,{method:'POST'});load()}
async function sell(s){await fetch('/api/sell/'+s,{method:'POST'});load()}
async function toggle(){await fetch('/api/toggle',{method:'POST'});load()}
load();setInterval(load,8000);
</script></body></html>
