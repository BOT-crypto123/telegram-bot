<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V5 DUAL 500+500</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:10px} .card{border:2px solid gold;border-radius:20px;padding:15px;margin:10px 0;background:#111} .circle{width:230px;height:230px;border-radius:50%;border:8px solid gold;margin:12px auto;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center} .btn{background:gold;color:#000;padding:10px 18px;border-radius:20px;font-weight:bold;border:none;margin:4px} .btn-b{background:#38bdf8} .small{font-size:11px;color:#aaa} .big{font-size:32px;font-weight:bold} .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px} .item{border:1px solid #333;padding:8px;border-radius:10px;background:#0a0a0a;font-size:12px}</style>
</head><body>
<h2 style="color:gold;text-align:center">💰 V5 DUAL SEPARADO - $500 BIN + $500 MT5</h2>
<div id="app">Cargando V5 estable...</div>
<script>
let S=null;
async function load(){
 try{
  let r=await fetch('/api/state'); S=await r.json();
  let cb=S.capital_binance||500; let cm=S.capital_mt5||500;
  let bola_b=S.bola_binance||cb/(S.max_entradas||8); let bola_m=S.bola_mt5||cm/4;
  document.getElementById('app').innerHTML=`
  <div class="card" style="border-color:gold">
   <h3>🟡 BINANCE $${cb.toFixed(2)} - BOLA $${bola_b.toFixed(2)}</h3>
   <div class="small">Disp $${(S.disponible_usd||0).toFixed(2)} | Bloq $${(S.bloqueado_usd||0).toFixed(2)} | Auto ${S.auto?'ON':'OFF'} | RSI ${S.rsi_compra}</div>
   <button class="btn" onclick="ver('BINANCE')">ENTRAR BINANCE - $500 FIJO</button>
  </div>
  <div class="card" style="border-color:#38bdf8">
   <h3>🔵 MT5 $${cm.toFixed(2)} - BOLA $${bola_m.toFixed(2)}</h3>
   <div class="small">XAUUSD ORO, XAGUSD PLATA, USOIL, SPX500 | SIN BTC | 4 entradas</div>
   <button class="btn btn-b" onclick="ver('MT5')">ENTRAR MT5 - $500 FIJO</button>
  </div>
  <div class="card" style="text-align:center;border-color:#333"><div class="big" style="color:#38bdf8">$${(cb+cm).toFixed(2)}</div><div class="small">TOTAL $${cb.toFixed(2)} + $${cm.toFixed(2)} | Cada círculo $500 NO $1000</div><div class="small" style="color:#22c55e">V5 ESTABLE - Sin cambios de API</div></div>`;
 }catch(e){ document.getElementById('app').innerHTML='Error V5: '+e; }
}
async function ver(m){
 let cap=m==='BINANCE'?S.capital_binance:S.capital_mt5; let bola=m==='BINANCE'?S.bola_binance:S.bola_mt5; let usd=S.usd_mxn||18.5;
 let pr= m==='BINANCE'? await (await fetch('/api/prices')).json() : await (await fetch('/api/prices_mt5')).json();
 let html='<button class="btn" onclick="load()">← VOLVER</button><h3>'+m+' MANUAL - $'+cap.toFixed(2)+' FIJO</h3><div class="card"><div class="circle" style="border-color:'+(m==='BINANCE'?'gold':'#38bdf8')+'"><div class="small">TOTAL REAL '+m+'</div><div class="big">$'+cap.toFixed(2)+'</div><div class="small">$'+(cap*usd).toFixed(0)+' MXN<br>BOLA $'+bola.toFixed(2)+'<br><b style="color:gold">$500 FIJO</b></div></div></div><div class="grid">';
 for(let k in pr){
  if(m==='MT5' && ['BTC','ETH','SOL','BNB','XRP','ADA','AVAX','DOGE'].includes(k)) continue;
  let v=pr[k]; let nombre=k; if(k==='XAUUSD') nombre='ORO'; if(k==='XAGUSD') nombre='PLATA'; if(k==='USOIL') nombre='PETROLEO';
  html+=`<div class="item"><b>${k}</b> ${nombre}<br>$${v.price.toFixed(2)}<br>RSI ${v.rsi} - ${v.sug}</div>`;
 }
 html+='</div><div class="small" style="margin-top:10px;color:#38bdf8">${m==='BINANCE'?'SOLO CRYPTO':'SOLO ORO/PLATA/PETROLEO/SP500 - CERO CRIPTO'}</div>';
 document.getElementById('app').innerHTML=html;
}
load();
</script></body></html>
