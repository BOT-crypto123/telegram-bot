<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V7 500+500</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:10px} .card{border:2px solid gold;border-radius:20px;padding:15px;margin:10px 0;background:#111} .circle{width:220px;height:220px;border-radius:50%;border:8px solid gold;margin:10px auto;display:flex;flex-direction:column;justify-content:center;align-items:center} .btn{background:gold;color:#000;padding:10px 20px;border-radius:20px;font-weight:bold;border:none;margin:5px} .small{font-size:11px;color:#aaa} .big{font-size:32px;font-weight:bold}</style>
</head><body>
<h2 style="color:gold;text-align:center">💰 V7 - $500 BINANCE + $500 MT5</h2>
<div id="app">Cargando...</div>
<script>
let S=null;
async function load(){
 try{
  let r=await fetch('/api/state'); S=await r.json();
  let cb=S.capital_binance||500; let cm=S.capital_mt5||500;
  let bola_b=(cb/(S.max_entradas||8)).toFixed(2); let bola_m=(cm/(S.max_entradas||8)).toFixed(2);
  document.getElementById('app').innerHTML=`
  <div class="card" style="border-color:gold" onclick="openB('BINANCE')">
   <h3>🟡 BINANCE $${cb.toFixed(2)} - BOLA $${bola_b}</h3>
   <div class="small">Disp $${(S.disponible_binance||cb).toFixed(2)} | ${S.auto_binance?'AUTO ON':'AUTO OFF'}</div>
   <button class="btn">ENTRAR BINANCE - $500 FIJO</button>
  </div>
  <div class="card" style="border-color:#38bdf8" onclick="openB('MT5')">
   <h3>🔵 MT5 $${cm.toFixed(2)} - BOLA $${bola_m}</h3>
   <div class="small">Disp $${(S.disponible_mt5||cm).toFixed(2)} | ${S.auto_mt5?'AUTO ON':'AUTO OFF'}</div>
   <div class="small">ORO, PLATA, PETROLEO, SP500, NASDAQ, DOW - SIN BTC</div>
   <button class="btn" style="background:#38bdf8">ENTRAR MT5 - $500 FIJO</button>
  </div>
  <div class="card" style="text-align:center"><div class="big" style="color:#38bdf8">$${(cb+cm).toFixed(2)}</div><div class="small">TOTAL BIN $${cb.toFixed(2)} + MT5 $${cm.toFixed(2)}</div></div>`;
 }catch(e){ document.getElementById('app').innerHTML='Error: '+e; }
}
async function openB(m){
 let cap=m==='BINANCE'?S.capital_binance:S.capital_mt5;
 let bola=cap/(S.max_entradas||8); let usd=S.usd_mxn||18.5;
 let pr= m==='BINANCE'? await (await fetch('/api/prices')).json() : await (await fetch('/api/prices_mt5')).json();
 let market='';
 for(let k in pr){
  if(m==='MT5' && (k.includes('BTC')||k.includes('ETH')||k.includes('SOL')||k.includes('BNB'))) continue;
  let v=pr[k];
  let name=k;
  if(k==='XAUUSD') name='ORO';
  if(k==='XAGUSD') name='PLATA';
  if(k==='USOIL') name='PETROLEO';
  if(k==='NAS100') name='NASDAQ';
  if(k==='SPX500') name='S&P500';
  market+=`<div style="border:1px solid #333;padding:8px;border-radius:10px;background:#0a0a0a;margin:4px"><b>${k}</b> ${name} $${v.price.toFixed(2)} RSI ${v.rsi} ${v.sug}</div>`;
 }
 document.getElementById('app').innerHTML=`
 <button class="btn" onclick="load()">← VOLVER</button>
 <h3 style="color:${m==='BINANCE'?'gold':'#38bdf8'}">${m} - $${cap.toFixed(2)} FIJO - BOLA $${bola.toFixed(2)} x ${S.max_entradas}</h3>
 <div class="card"><div class="circle"><div class="small">TOTAL REAL ${m}</div><div class="big">$${cap.toFixed(2)}</div><div class="small">$${(cap*usd).toFixed(0)} MXN<br>BOLA $${bola.toFixed(2)}<br><b style="color:gold">$500 FIJO NO $1000</b></div></div></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${market}</div>
 <div style="margin-top:10px;color:#38bdf8;font-size:11px">${m==='BINANCE'?'BINANCE SOLO CRYPTO':'MT5 SOLO ORO/PETROLEO/INDICES - SIN BTC/ETH/SOL - CERO CRIPTO'}</div>`;
}
load(); setInterval(load,30000);
</script></body></html>
