<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUAL V5 GAN FINAL</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui;display:flex;min-height:100vh}
.col{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:28px}.col.binance{background:#000;border-right:1px solid #0f0f0f}.col.mt5{background:#080f1e}
.label{font-weight:900;font-size:13px;letter-spacing:0.5px;margin-bottom:8px}.label.b{color:#facc15}.label.m{color:#5aa8ff}
.circle{width:210px;height:210px;border-radius:50%;border:6px solid #facc15;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;cursor:pointer;transition:0.15s}
.circle:active{transform:scale(0.96);box-shadow:0 0 30px #facc15aa}
.circle.mt5{border-color:#3b82f6}.circle.mt5:active{box-shadow:0 0 30px #3b82f6aa}
.cap{font-size:38px;font-weight:900;line-height:1}.mxn{font-size:11px;color:#888;margin-top:6px;font-weight:700}
.gan-lab{font-size:10px;color:#555;margin-top:38px;letter-spacing:0.8px}.gan{font-size:20px;font-weight:900;color:#22c55e;line-height:1.1}.gan-usd{font-size:12px;color:#666;margin-top:3px}.det{font-size:10px;color:#333;margin-top:4px}
@media(max-width:700px){.circle{width:165px;height:165px}.cap{font-size:30px}.gan{font-size:17px}}
</style></head><body>
<div class="col binance">
<div class="label b">◆ BINANCE</div>
<div class="circle" onclick="location.href='/detail'"><span class="cap" id="capB">$506.93</span><span class="mxn" id="mxnB">$8592.54 MXN</span></div>
<div class="gan-lab">GANANCIA REAL</div><div class="gan" id="ganB">+$117.54 MXN</div><div class="gan-usd" id="ganUsdB">+$6.93 USD</div><div class="det" id="detB">D:$314 B:$193 | $16.95</div>
</div>
<div class="col mt5">
<div class="label m">📊 MT5</div>
<div class="circle mt5" onclick="location.href='/detail?mt5=1'"><span class="cap" id="capM">$507.81</span><span class="mxn" id="mxnM">$8607.42 MXN</span></div>
<div class="gan-lab">GANANCIA REAL</div><div class="gan" id="ganM">+$132.42 MXN</div><div class="gan-usd" id="ganUsdM">+$7.81 USD</div><div class="det" id="detM">D:$189 B:$319 | $16.95</div>
</div>
<script>
const MXN=16.95;
async function load(){
 try{
  let s=await fetch('/api/state').then(r=>r.json());
  let capB=s.capital_binance||s.capital||506.93;
  let capM=s.capital_mt5||507.81;
  let ganB=s.ganancia_binance||s.ganancia||6.93;
  let ganM=s.ganancia_mt5||7.81;
  document.getElementById('capB').innerText='$'+capB.toFixed(2);
  document.getElementById('capM').innerText='$'+capM.toFixed(2);
  document.getElementById('mxnB').innerText='$'+(capB*MXN).toFixed(2)+' MXN';
  document.getElementById('mxnM').innerText='$'+(capM*MXN).toFixed(2)+' MXN';
  document.getElementById('ganB').innerText='+$'+(ganB*MXN).toFixed(2)+' MXN';
  document.getElementById('ganM').innerText='+$'+(ganM*MXN).toFixed(2)+' MXN';
  document.getElementById('ganUsdB').innerText='+$'+ganB.toFixed(2)+' USD';
  document.getElementById('ganUsdM').innerText='+$'+ganM.toFixed(2)+' USD';
  document.getElementById('detB').innerText=`D:$${s.deposito_binance||314} B:$${s.bonos_binance||193} | $${MXN}`;
  document.getElementById('detM').innerText=`D:$${s.deposito_mt5||189} B:$${s.bonos_mt5||319} | $${MXN}`;
 }catch(e){}
}
load(); setInterval(load,4000);
</script></body></html>
