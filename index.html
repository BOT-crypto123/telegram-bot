<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUAL V5</title><style>*{box-sizing:border-box;font-family:system-ui;margin:0}body{background:#000;color:#fff}.wrap{display:flex;height:100vh}.side{width:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}.c{width:170px;height:170px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center}.cy{border:8px solid #facc15}.cb{border:8px solid #3b82f6}.cap{font-size:38px;font-weight:900}</style></head><body><div class="wrap"><div class="side" style="background:#000" onclick="location.href='/dashboard.html'"><div style="color:#facc15;font-weight:900">◆ BINANCE</div><div class="c cy"><div class="cap" id="cb">$0</div></div><div id="bb" style="font-size:11px;margin-top:10px"></div></div><div class="side" style="background:#0a1930" onclick="location.href='/dashboard_mt5.html'"><div style="color:#60a5fa;font-weight:900">📊 MT5</div><div class="c cb"><div class="cap" id="cm">$0</div></div><div id="bm" style="font-size:11px;margin-top:10px"></div></div></div><script>async function u(){let s=await fetch('/api/state?nocache='+Date.now()).then(r=>r.json());let tb=(s.disponible_usd||0)+(s.bloqueado_usd||0)+(s.gan_acum||0);let tm=(s.disponible_m||0)+(s.bloqueado_m||0)+(s.gan_mt5||0);document.getElementById('cb').innerText='$'+tb.toFixed(2);document.getElementById('cm').innerText='$'+tm.toFixed(2);document.getElementById('bb').innerText='D:$'+s.disponible_usd.toFixed(2)+' B:$'+s.bloqueado_usd.toFixed(2)+' G:$'+s.gan_acum.toFixed(2);document.getElementById('bm').innerText='D:$'+s.disponible_m.toFixed(2)+' B:$'+s.bloqueado_m.toFixed(2)+' G:$'+s.gan_mt5.toFixed(2);}u();setInterval(u,1000);</script></body></html>
