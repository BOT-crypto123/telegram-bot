<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DUAL V5</title><style>body{margin:0;background:#000;color:#fff;display:flex;min-height:100vh;font-family:system-ui} .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505;border-right:1px solid #222} .m{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020a14} .cir{width:220px;height:220px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900} .bin{border:10px solid #facc15} .mt5{border:10px solid #3b82f6} small{opacity:.6;margin-top:10px}</style></head><body>
<div class="b" onclick="location.href='/dashboard.html'"><div style="color:#facc15;font-weight:900">◆ BINANCE</div><div id="tb" class="cir bin">$0</div><small id="db"></small></div>
<div class="m" onclick="location.href='/dashboard_mt5.html'"><div style="color:#60a5fa;font-weight:900">📊 MT5</div><div id="tm" class="cir mt5">$0</div><small id="dm"></small></div>
<script>
async function load(){
  try{
    let s=await fetch('/api/state').then(r=>r.json());
    let d_b=s.disponible_usd||500, b_b=s.bloqueado_usd||0, g_b=s.gan_acum||0;
    let d_m=s.disponible_m||500, b_m=s.bloqueado_m||0, g_m=s.gan_mt5||0;
    // CORREGIDO: Total = D + B (D ya incluye la ganancia)
    let tot_b = d_b + b_b;
    let tot_m = d_m + b_m;
    document.getElementById('tb').innerText='$'+tot_b.toFixed(2);
    document.getElementById('db').innerText=`D:$${d_b.toFixed(2)} B:$${b_b.toFixed(2)} G:$${g_b.toFixed(2)}`;
    document.getElementById('tm').innerText='$'+tot_m.toFixed(2);
    document.getElementById('dm').innerText=`D:$${d_m.toFixed(2)} B:$${b_m.toFixed(2)} G:$${g_m.toFixed(2)}`;
  }catch(e){}
}
setInterval(load,2000); load();
</script></body></html>
