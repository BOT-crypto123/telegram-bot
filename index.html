<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DUAL V5</title><style>*{box-sizing:border-box;font-family:system-ui;margin:0}body{background:#000;color:#fff}.wrap{display:flex;height:100vh}.side{width:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.left{background:#000}.right{background:#0a1930}.c{width:175px;height:175px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center}.cy{border:8px solid #facc15}.cb{border:8px solid #3b82f6}.cap{font-size:38px;font-weight:900}.mxn{font-size:12px;color:#22c55e;background:#0f2e1a;padding:4px 10px;border-radius:20px;margin-top:6px}.b{font-size:11px;margin-top:10px;text-align:center}</style></head><body><div class="wrap"><div class="side left" onclick="location.href='/dashboard.html'"><div style="color:#facc15;font-weight:900;font-size:13px">◆ BINANCE - CRYPTO</div><div class="c cy"><div style="font-size:11px;opacity:.6">Capital</div><div class="cap" id="cb">$0</div><div class="mxn" id="mb"></div></div><div class="b" id="bb"></div></div><div class="side right" onclick="location.href='/dashboard_mt5.html'"><div style="color:#60a5fa;font-weight:900;font-size:13px">📊 MT5 SIN MT5</div><div class="c cb"><div style="font-size:11px;opacity:.6">Capital</div><div class="cap" id="cm">$0</div><div class="mxn" id="mm"></div></div><div class="b" id="bm"></div></div></div><script>async function u(){let s=await fetch('/api/state?t='+Date.now()).then(r=>r.json());let tb=s.disponible_usd+s.bloqueado_usd+s.gan_acum;let tm=s.disponible_m+s.bloqueado_m+s.gan_mt5;let mx=17.2;try{let d=await fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json());mx=d.rates.MXN;}catch{}document.getElementById('cb').innerText='$'+tb.toFixed(2);document.getElementById('cm').innerText='$'+tm.toFixed(2);document.getElementById('mb').innerText='≈ $'+(tb*mx).toFixed(0)+' MXN';document.getElementById('mm').innerText='≈ $'+(tm*mx).toFixed(0)+' MXN';document.getElementById('bb').innerHTML='bola $'+(tb/8).toFixed(2)+'<br>D:$'+s.disponible_usd.toFixed(2)+' B:$'+s.bloqueado_usd.toFixed(2)+' G:$'+s.gan_acum.toFixed(2);document.getElementById('bm').innerHTML='bola $'+(tm/8).toFixed(2)+'<br>D:$'+s.disponible_m.toFixed(2)+' B:$'+s.bloqueado_m.toFixed(2)+' G:$'+s.gan_mt5.toFixed(2);}u();setInterval(u,2000);</script></body></html>
