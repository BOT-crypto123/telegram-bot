<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DUAL V5 MXN</title><style>body{margin:0;background:#000;color:#fff;display:flex;min-height:100vh;font-family:system-ui} .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505;border-right:1px solid #222} .m{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020a14} .cir{width:220px;height:220px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;text-align:center} .bin{border:10px solid #facc15} .mt5{border:10px solid #3b82f6} .usd{font-size:42px;line-height:1} .mxn{font-size:14px;margin-top:8px;opacity:.85;font-weight:700} small{opacity:.6;margin-top:10px;font-size:12px;text-align:center}</style></head><body>
<div class="b" onclick="location.href='/dashboard.html'"><div style="color:#facc15;font-weight:900">◆ BINANCE</div><div id="tb" class="cir bin"><div id="tb_usd" class="usd">$0</div><div id="tb_mxn" class="mxn">$0 MXN</div></div><small id="db"></small></div>
<div class="m" onclick="location.href='/dashboard_mt5.html'"><div style="color:#60a5fa;font-weight:900">📊 MT5</div><div id="tm" class="cir mt5"><div id="tm_usd" class="usd">$0</div><div id="tm_mxn" class="mxn">$0 MXN</div></div><small id="dm"></small></div>
<script>
let USDMXN = 17.0;
async function getRate(){
  try{
    let r = await fetch('https://api.exchangerate-api.com/v4/latest/USD').then(x=>x.json());
    if(r && r.rates && r.rates.MXN) USDMXN = r.rates.MXN;
  }catch(e){
    try{
      let r2 = await fetch('https://open.er-api.com/v6/latest/USD').then(x=>x.json());
      if(r2 && r2.rates && r2.rates.MXN) USDMXN = r2.rates.MXN;
    }catch(e2){}
  }
  document.getElementById('db').setAttribute('data-rate', USDMXN);
}
getRate();
setInterval(getRate, 60000);

async function load(){
  try{
    let s=await fetch('/api/state').then(r=>r.json());
    let d_b=s.disponible_usd||500, b_b=s.bloqueado_usd||0, g_b=s.gan_acum||0;
    let d_m=s.disponible_m||500, b_m=s.bloqueado_m||0, g_m=s.gan_mt5||0;
    let tot_b = d_b + b_b;
    let tot_m = d_m + b_m;
    document.getElementById('tb_usd').innerText='$'+tot_b.toFixed(2);
    document.getElementById('tm_usd').innerText='$'+tot_m.toFixed(2);
    document.getElementById('tb_mxn').innerText='$'+(tot_b*USDMXN).toLocaleString('es-MX',{minimumFractionDigits:2, maximumFractionDigits:2})+' MXN';
    document.getElementById('tm_mxn').innerText='$'+(tot_m*USDMXN).toLocaleString('es-MX',{minimumFractionDigits:2, maximumFractionDigits:2})+' MXN';
    document.getElementById('db').innerText=`D:$${d_b.toFixed(2)} B:$${b_b.toFixed(2)} G:$${g_b.toFixed(2)}\nUSD/MXN $${USDMXN.toFixed(2)}`;
    document.getElementById('dm').innerText=`D:$${d_m.toFixed(2)} B:$${b_m.toFixed(2)} G:$${g_m.toFixed(2)}\nUSD/MXN $${USDMXN.toFixed(2)}`;
  }catch(e){}
}
setInterval(load,2000); load();
</script></body></html>
