<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DUAL V5 - FINAL</title>
<style>*{box-sizing:border-box;font-family:system-ui;margin:0}body{background:#000;color:#fff}
.wrap{display:flex;width:100vw;height:100vh}.side{width:50%;padding:12px;text-align:center;cursor:pointer}
.left{background:#050505}.right{background:#0a1930}
h2{font-size:14px;font-weight:900}.hy{color:#facc15}.hb{color:#60a5fa}.sub{font-size:10px;opacity:.5;margin-bottom:12px}
.c{width:175px;height:175px;border-radius:50%;margin:20px auto;display:flex;flex-direction:column;justify-content:center;align-items:center}
.cy{border:8px solid #facc15;box-shadow:0 0 40px rgba(250,204,21,.6);background:radial-gradient(#1a1600,#000)}
.cb{border:8px solid #3b82f6;box-shadow:0 0 40px rgba(59,130,246,.6);background:radial-gradient(#0e1a35,#000)}
.cap{font-size:38px;font-weight:900}.mxn{font-size:13px;color:#22c55e;background:rgba(34,197,94,.15);padding:4px 12px;border-radius:20px;margin-top:8px;border:1px solid #22c55e}
.bola{margin-top:12px;font-size:12px;font-weight:800}
</style></head><body>
<div class="wrap">
<div class="side left" onclick="location.href='/dashboard.html'">
<h2 class="hy">◆ BINANCE - CRYPTO</h2><div class="sub" id="s-b">Live</div>
<div class="c cy"><div style="font-size:11px;opacity:.6">Capital</div><div class="cap" id="c-b">$0.00</div><div class="mxn" id="m-b">~ $0 MXN</div></div>
<div class="bola" id="b-b" style="color:#facc15"></div>
</div>
<div class="side right" onclick="location.href='/dashboard_mt5.html'">
<h2 class="hb">📊 MT5 SIN MT5</h2><div class="sub" id="s-m">Live</div>
<div class="c cb"><div style="font-size:11px;opacity:.6">Capital</div><div class="cap" id="c-m">$0.00</div><div class="mxn" id="m-m">~ $0 MXN</div></div>
<div class="bola" id="b-m" style="color:#60a5fa"></div>
</div>
</div>
<script>
async function upd(){
 try{
  let r=await fetch('/api/state?t='+Date.now());
  let s=await r.json();
  let tb=(s.disponible_usd||0)+(s.bloqueado_usd||0)+(s.gan_acum||0);
  let tm=(s.disponible_m||0)+(s.bloqueado_m||0)+(s.gan_mt5||0);
  let bb=tb/(s.max_entradas||8);
  let bm=tm/(s.max_m||8);
  let mx=17.2;
  try{let d=await fetch('https://open.er-api.com/v6/latest/USD').then(x=>x.json()); mx=d.rates.MXN||17.2}catch{}
  document.getElementById('c-b').innerText='$'+tb.toFixed(2);
  document.getElementById('c-m').innerText='$'+tm.toFixed(2);
  document.getElementById('m-b').innerText='≈ $'+(tb*mx).toFixed(0)+' MXN';
  document.getElementById('m-m').innerText='≈ $'+(tm*mx).toFixed(0)+' MXN';
  document.getElementById('b-b').innerHTML='bola $'+bb.toFixed(2)+' ≈ $'+(bb*mx).toFixed(0)+' MXN<br>D:$'+s.disponible_usd.toFixed(2)+' B:$'+s.bloqueado_usd.toFixed(2)+' G:$'+s.gan_acum.toFixed(2);
  document.getElementById('b-m').innerHTML='bola $'+bm.toFixed(2)+' ≈ $'+(bm*mx).toFixed(0)+' MXN<br>D:$'+s.disponible_m.toFixed(2)+' B:$'+s.bloqueado_m.toFixed(2)+' G:$'+s.gan_mt5.toFixed(2);
  document.getElementById('s-b').innerText='Total REAL: $'+tb.toFixed(2);
  document.getElementById('s-m').innerText='Total REAL: $'+tm.toFixed(2);
 }catch(e){}
}
upd(); setInterval(upd,3000);
</script>
</body></html>
